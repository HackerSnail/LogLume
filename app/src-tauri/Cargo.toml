[package]
name = "lumelog-app"
version = "0.1.0"
description = "LogLume desktop shell (Tauri v2) — thin IPC layer over lumelog-core"
edition = "2021"
rust-version = "1.89"

[lib]
name = "lumelog_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"
rquickjs = "0.14"
# MF4 reader (Roadmap-4): mmap only, no rayon/arrow/parquet surface.
falcon_mdf = { version = "0.7", default-features = false, features = ["mmap"] }
lumelog-core = { path = "../../crates/lumelog-core" }
lumelog-can = { path = "../../crates/lumelog-can" }
calamine = { version = "0.37.0", features = ["chrono"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.12.1"
wasmi = "2.0.0"
# Built-in git (Plan 35): libgit2 compiled in, no PATH dependency.
git2 = "0.20"
# Single-instance (Plan 43): second launch forwards argv to the first.
tauri-plugin-single-instance = "2"
# AI assist: OpenAI-compatible HTTP client (streaming chunks parsed by hand).
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# OCR (spec §8): image decode + component integrity checks.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# ONNX Runtime via the offline component package: `load-dynamic` keeps the
# native library out of the main binary (P6 stays ≤15MB). `download-binaries`
# is deliberately off — the runtime ships in the component, never at build time.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }

# macOS-only: strip the English AutoFill / Dictation / Emoji items AppKit
# injects into the Edit menu (see menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem"] }

# Windows-only: built-in OCR engine (Windows.Media.Ocr).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
tempfile = "3"
wasm-encoder = "0.262.0"
